
# validation

- name: assert all vars are set
  assert: 
    that:
      - item is defined
      - item | length > 0
    quiet: true
  loop:
  - app_name
  - temp_folder
  - clear_temp_folder
  - service_name
  - main_class
  - installation_folder
  - clear_before_install
  - server_port
  - installer_file_name
  - s3_download_url
  - launcher_file_name
  - db_connection_string
  - db_username
  - db_password
  - application_properties
  - extra_java_options
  - kill_notepad
  - logs_folder

# required dependencies

- name: make sure chocolatey is installed on the machine
  win_command: "choco.exe --version"
  register: choco_test
  ignore_errors: yes

- name: install chocolatey
  block:
    
    - name: install Chocolatey if its not found
      win_chocolatey:
        name: chocolatey
        state: present
      register: choco_install_first
      ignore_errors: yes

    - name: pause for 60 seconds if first choco install failed
      pause:
        seconds: 60
      when: choco_install_first.rc != 0

    - name: wait more any choco.exe process to finished 
      win_wait_for_process:
        process_name_exact: choco
        state: absent
        timeout: 180
      when: choco_install_first.rc != 0
      failed_when: no
    
    - name: validate if chocolatey is installed on the machine
      win_command: "choco.exe --version"
      when: choco_install_first.rc != 0     

  when: choco_test.rc != 0

- name: disable enhanced exit codes
  win_chocolatey_feature:
    name: useEnhancedExitCodes
    state: disabled

- name: install nssm dependency
  win_chocolatey:
    name: nssm
    state: present

# set temp folder

- name: make sure temp folder exists
  win_file:
    path: "{{ temp_folder }}"
    state: directory

# required java dependency

- name: make sure java is installed on the machine
  win_command: "{{ java_bin }} -version"
  register: java_test
  ignore_errors: yes

- name: fail if java is not found
  fail:
    msg: "java must be accesible in path {{ java_bin }}"
  when: java_test.rc != 0

# download the file

- name: download zip from s3 url
  win_get_url:
    url: "{{ s3_download_url }}"
    dest: "{{ temp_folder }}\\{{ installer_file_name }}"
    timeout: "{{ download_timeout | default(60) }}"
    force: no
  when: custom_download_url == ""

- name: download zip from custom url
  win_get_url:
    url: "{{ custom_download_url }}"
    dest: "{{ temp_folder }}\\{{ installer_file_name }}"
    timeout: "{{ download_timeout | default(60) }}"
    force: no
    force_basic_auth: yes
    url_username: "{{ custom_download_username }}"
    url_password: "{{ custom_download_password }}"
  when: custom_download_url != ""

# stop old service

- name: stop the old install4j service if exists
  win_service:
    name: "{{ item }}"
    state: absent
  become: yes 
  with_items:
    - reporter_server

- name: stop the old service
  win_nssm:
    name: "{{ service_name }}"
    state: absent
  become: yes

# kill notepadd

- name: kill notepad apps
  block:
    - name: kill notepad
      win_shell: |
        taskkill /F /IM notepad.exe
      register: killnotepad
      changed_when: killnotepad.rc == 0 and 'The process "notepad.exe" not found.' not in killnotepad.stderr
      failed_when: killnotepad.rc != 0 and 'The process "notepad.exe" not found.' not in killnotepad.stderr
      become: yes

    - name: kill notepad++
      win_shell: |
        taskkill /F /IM notepad++.exe
      register: killnotepadplusplus
      changed_when: killnotepadplusplus.rc == 0 and 'The process "notepad++.exe" not found.' not in killnotepadplusplus.stderr
      failed_when: killnotepadplusplus.rc != 0 and 'The process "notepad++.exe" not found.' not in killnotepadplusplus.stderr
      become: yes
      
  when: kill_notepad == True
  ignore_errors: yes

# delete old installation (optional)

- name: clear old installation folder
  win_file: 
    path: "{{ installation_folder }}"
    state: absent
  when: clear_before_install == True

# unpack all the files to the installation folder

- name: make sure installation folder exists
  win_file:
    path: "{{ installation_folder }}"
    state: directory
  become: yes

- name: unzip the file
  win_unzip:
    src: "{{ temp_folder }}\\{{ installer_file_name }}"
    dest: "{{ installation_folder }}"
    remote_src: yes
  become: yes

- name: copy start script
  win_template:
    src: start.bat.j2
    dest: "{{ installation_folder }}\\{{ launcher_file_name }}"
  become: yes

# configure installed 

- name: update application properties file
  dai_continuous_testing.utilities.application_properties:
    path: "{{ installation_folder }}\\config\\application.properties"
    properties: "{{ application_properties }}"
    backup: yes
    comment_existing: yes
    marker: "ANSIBLE MANAGED BLOCK - Application Properties"
  become: yes

- name: verify application properties file exists
  win_stat:
    path: "{{ installation_folder }}\\config\\application.properties"
  register: properties_file_stat

- name: ensure properties file is accessible
  assert:
    that:
      - properties_file_stat.stat.exists
      - properties_file_stat.stat.readable
    fail_msg: "Application properties file not found or not readable"
    success_msg: "Application properties file successfully created/updated"

# Check disk space before installation
- name: check installation drive disk space
  dai_continuous_testing.utilities.win_drive_letter_to_disk_info:
    drive_letter: "{{ installation_folder | win_dirname | win_split | first }}"
  register: installation_drive_info
  ignore_errors: yes

- name: display disk space information
  debug:
    msg: |
      Installation Drive Information:
      Drive: {{ installation_drive_info.drive_letter | default('Unknown') }}
      {% if installation_drive_info.success | default(false) %}
      Total Space: {{ (installation_drive_info.disk_info.Size / 1024 / 1024 / 1024) | round(2) }} GB
      Free Space: {{ (installation_drive_info.disk_info.FreeSpace / 1024 / 1024 / 1024) | round(2) }} GB
      Used Space: {{ ((installation_drive_info.disk_info.Size - installation_drive_info.disk_info.FreeSpace) / 1024 / 1024 / 1024) | round(2) }} GB
      File System: {{ installation_drive_info.disk_info.FileSystem }}
      Volume Label: {{ installation_drive_info.disk_info.VolumeLabel | default('N/A') }}
      {% else %}
      Status: Failed to retrieve disk information
      Error: {{ installation_drive_info.msg | default('Unknown error') }}
      {% endif %}
  when: installation_drive_info is defined

- name: warn if disk space is low
  debug:
    msg: |
      WARNING: Low disk space detected!
      Available: {{ (installation_drive_info.disk_info.FreeSpace / 1024 / 1024 / 1024) | round(2) }} GB
      Recommendation: Ensure at least 5GB free space for optimal operation.
  when: 
    - installation_drive_info.success | default(false)
    - (installation_drive_info.disk_info.FreeSpace / 1024 / 1024 / 1024) < 5

- name: make sure logs folder exists
  win_file:
    path: "{{ logs_folder }}"
    state: directory
  become: yes

- name: remove existing logs folder from installation folder
  win_file:
    path: "{{ installation_folder }}\\logs"
    state: absent
  become: yes

- name: create sym link for logs folder
  win_command: "cmd.exe /k mklink /D {{ installation_folder }}\\logs {{ logs_folder }}"
  become: yes

- name: update java path in reporter-backup.bat file
  win_lineinfile:
    path: "{{ installation_folder }}\\reporter-backup.bat"
    line: "{{ java_bin }} ^"
    regexp: "^java"
    mode: '0777'
  become: yes

- name: reset pairing key
  win_file:
    path: "{{ installation_folder }}\\config\\pairing.conf.xml"
    state: absent
  become: yes

# remove vmoptions file

- name: check vmoptions files to remove
  win_find:
    paths: "{{ installation_folder }}"
    file_type: file
    patterns: "*.vmoptions"
  register: delete_vmoptions
  become: yes

- name: remove vmoptions files from installation folder
  win_file:
    path: "{{ item.path }}"
    state: absent
  become: yes
  with_items:
    - "{{ delete_vmoptions.files }}"

# install the service

- name: create the service
  win_nssm:
    name: "{{ service_name }}"
    application: "{{ installation_folder }}\\{{ launcher_file_name }}"
    stdout_file: "{{ installation_folder }}\\logs\\server.out.log"
    stderr_file: "{{ installation_folder }}\\logs\\server.err.log"
    state: present
  become: yes
  notify:
    - start the service

# always append error logs, not to overwrite files
- name: enable stderr logs to append
  win_command: "nssm set {{ service_name }} AppStderrCreationDisposition 4"
  changed_when: no
  ignore_errors: yes
  become: yes
  
- name: set auto resart on failure of service
  win_command: "sc failure {{ service_name }} reset=600 actions=restart/15000"
  become: yes

# expose role output

- name: sanitize role name
  set_fact:
    sanitize_role_name: "{{ role_name | replace('-', '_') | regex_replace('([^A-Za-z0-9_])', '') | trim }}"

- name: expose role output
  set_fact:
    "{{ sanitize_role_name }}":
      server_port: "{{ server_port }}"
      app_version: "{{ app_version }}"
      installation_folder: "{{ installation_folder }}"
      configuration_file: "{{ installation_folder }}\\config\\application.properties"
      service_name: "{{ service_name }}"

# Windows Health check after installation
- name: verify reporter service health after installation (Windows)
  dai_continuous_testing.utilities.win_health_check:
    url: "http://localhost:{{ server_port }}{{ health_check_uri | default('/manage/health') }}"
    expected_status: 200
    timeout: 30
    max_retries: 10
    delay_between_tries: 5
    initial_delay: 15
    headers: '{"Accept": "application/json", "User-Agent": "Ansible-Reporter-HealthCheck-Windows"}'
  register: reporter_health_check_windows
  when: start_after_install | default(true)
  ignore_errors: yes

- name: verify reporter service is listening on port
  win_wait_for:
    port: "{{ server_port }}"
    host: "localhost"
    timeout: 60
    delay: 10
  register: reporter_port_check
  when: start_after_install | default(true)
  ignore_errors: yes

- name: display comprehensive Windows health check results
  debug:
    msg: |
      Reporter Windows Health Check Results:
      =====================================
      Service Health Check:
        Status: {{ 'PASSED' if reporter_health_check_windows.success | default(false) else 'FAILED' }}
        URL: {{ reporter_health_check_windows.url | default('N/A') }}
        Message: {{ reporter_health_check_windows.msg | default('Health check was not performed') }}
        
      Port Availability Check:
        Status: {{ 'PASSED' if reporter_port_check is success else 'FAILED' }}
        Port: {{ server_port }}
        
      Service Status:
        Name: {{ service_name }}
        Installation: {{ installation_folder }}
        
      System Information:
        Drive: {{ installation_drive_info.drive_letter | default('Unknown') }}
        {% if installation_drive_info.success | default(false) %}
        Free Space: {{ (installation_drive_info.disk_info.FreeSpace / 1024 / 1024 / 1024) | round(2) }} GB
        {% endif %}
  when: reporter_health_check_windows is defined or reporter_port_check is defined
